<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop - GARAGE27</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Montserrat&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  
<!-- Snipcart -->
<div hidden id="snipcart" data-api-key="YOUR_PUBLIC_API_KEY_HERE"></div>
<script async src="https://cdn.snipcart.com/themes/v3.6.1/default/snipcart.js"></script>
<link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.6.1/default/snipcart.css" />

</head>
<body>
  <header>
    <img src="garage27-logo.png" alt="GARAGE27 Logo" class="logo"/>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="builds.html">Builds</a>
      <a href="#" class="snipcart-checkout">Cart (<span class="snipcart-items-count">0</span>)</a>
    </nav>
  </header>

  <section class="shop">
    <h2>Merch Store</h2>
    <div class="products">
      <div class="product">
        <img src="shirt1.jpg" alt="Shirt"/>
        <h3>Drift Tee</h3>
        <p>$29.99</p>
        <button class="btn snipcart-add-item"
          data-item-id="drift-tee-001"
          data-item-name="Drift Tee"
          data-item-price="29.99"
          data-item-url="/shop.html"
          data-item-description="A clean JDM-inspired tee for true car fans.">
          Add to Cart
        </button>
      </div>
    </div>
  </section>

  <footer>
    <div class="contact">
      <p>Contact us: garage27@email.com | Instagram: @garage27</p>
    </div>
  </footer>
</body>
</html>
